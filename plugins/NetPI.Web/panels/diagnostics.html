<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diagnostics</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 12.5px/1.45 Inter, ui-sans-serif, "Segoe UI", system-ui, sans-serif; color: #e5e7eb; }
  .grid { display: grid; grid-template-columns: 95px minmax(0, 1fr); gap: 8px 10px; align-items: baseline; font-size: 10.5px; }
  .grid span { color: #687181; }
  .grid strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #cbd2dd; font-weight: 550; }
</style>
</head>
<body>
  <div class="grid">
    <span>Connection</span><strong id="connection">connecting</strong>
    <span>Agent</span><strong id="agent">—</strong>
    <span>Session</span><strong id="session">—</strong>
    <span>Workspace</span><strong id="workspace">—</strong>
    <span>Model</span><strong id="model">—</strong>
    <span>Reasoning</span><strong id="reasoning">off / default</strong>
    <span>Prompt tokens</span><strong id="prompt">—</strong>
    <span>Total tokens</span><strong id="total">—</strong>
  </div>
  <script>
    // Self-hosted panel: state via the host's /ws (docs/web-panels.md).
    const $ = (id) => document.getElementById(id);
    function fmt(n) {
      if (!n) return "—";
      return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1000 ? Math.round(n / 1000) + "k" : String(n);
    }
    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen = () => { $("connection").textContent = "connected"; };
    ws.onclose = () => { $("connection").textContent = "disconnected"; setTimeout(() => location.reload(), 2000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      const p = m.payload || {};
      switch (m.type) {
        case "agent.state":
          if (p.state) $("agent").textContent = p.state;
          break;
        case "session.updated":
          if (p.title) $("session").textContent = p.title;
          if (p.workspace) $("workspace").textContent = p.workspace;
          if (p.modelId) $("model").textContent = p.modelId;
          if (p.reasoningLevel) $("reasoning").textContent = p.reasoningLevel;
          break;
        case "usage.updated":
          $("prompt").textContent = fmt(p.promptTokens);
          $("total").textContent = fmt(p.totalTokens);
          break;
      }
    };
  </script>
</body>
</html>
