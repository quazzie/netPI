<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>netPI — Background Tasks</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #e6edf3;
    --dim: #8b949e; --accent: #58a6ff; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 13px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 8px; padding: 5px 10px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); flex: none; }
  header .dot.up { background: var(--ok); }
  header .dim { color: var(--dim); font-size: 11px; }
  header .count { margin-left: auto; color: var(--dim); font-size: 11px; }
  main { padding: 10px; overflow-y: auto; }
  .jlist { display: flex; flex-direction: column; gap: 8px; }
  .job { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
         padding: 8px 10px; min-width: 0; }
  .job.running { border-color: rgba(63,185,80,.45); }
  .jtop { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .jcmd { font-weight: 600; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; flex: 1; min-width: 0; }
  .badge { padding: 2px 7px; border-radius: 999px; font-size: 10.5px; flex: none;
           color: var(--dim); background: #11151a; }
  .badge.Running { color: var(--ok); background: rgba(63,185,80,.12); }
  .badge.Succeeded { color: var(--ok); background: rgba(63,185,80,.12); }
  .badge.Failed { color: var(--err); background: rgba(248,81,73,.12); }
  .badge.Killed { color: var(--warn); background: rgba(210,153,34,.12); }
  .actions { display: flex; gap: 6px; flex: none; }
  .btn { border: 1px solid var(--border); background: transparent; color: var(--dim);
         border-radius: 6px; padding: 3px 9px; font-size: 11.5px; cursor: pointer; }
  .btn:hover:not(:disabled) { background: #1d222b; color: var(--fg); }
  .btn.stop { color: var(--err); border-color: rgba(248,81,73,.4); }
  .btn.stop:hover:not(:disabled) { background: rgba(248,81,73,.12); color: var(--err); }
  .btn:disabled { opacity: .5; cursor: default; }
  .jmeta { color: var(--dim); font-size: 11px; margin-top: 4px; }
  pre.log { background: #0a0e14; border: 1px solid var(--border); border-radius: 8px; padding: 8px;
            overflow-x: auto; overflow-y: auto; max-height: 300px; margin: 8px 0 0;
            font: 11px/1.6 ui-monospace, Consolas, monospace;
            white-space: pre-wrap; word-break: break-all; }
  .empty { color: var(--dim); font-style: italic; padding: 16px 4px; }
  .warn-line { color: var(--warn); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <span class="dim">background tasks</span>
  <span class="count" id="count"></span>
  <span class="dim" style="margin-left:8px">auto 2 s</span>
</header>
<main>
  <div class="jlist" id="list"></div>
</main>
<script>
const list = document.getElementById("list");
const dot = document.getElementById("dot");
const count = document.getElementById("count");
const expanded = new Set();   // job ids whose output pane is open
let failures = 0;

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmtDur(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${ss}s`;
  return `${ss}s`;
}
function fmtTime(iso) { try { return new Date(iso).toLocaleTimeString([], { hour12: false }); } catch { return iso; } }

function jobCard(j) {
  const end = j.exitedAt ? new Date(j.exitedAt) : Date.now();
  const dur = fmtDur(end - new Date(j.startedAt));
  const meta = [
    j.id,
    j.shell ? `shell ${j.shell}` : null,
    `started ${fmtTime(j.startedAt)}`,
    j.state === "Running" ? `for ${dur} \u2026` : `ran ${dur}`,
    (j.exitCode !== null && j.exitCode !== undefined) ? `exit ${j.exitCode}` : null,
  ].filter(Boolean).join(" \u00b7 ");
  const card = document.createElement("div");
  card.className = "job" + (j.state === "Running" ? " running" : "");
  card.innerHTML =
    `<div class="jtop">
       <span class="badge ${esc(j.state)}">${esc(j.state)}</span>
       <span class="jcmd" title="${esc(j.command)}">${esc(j.command)}</span>
       <span class="actions">
         ${j.state === "Running" ? `<button class="btn stop" data-stop="${esc(j.id)}">stop</button>` : ""}
         <button class="btn" data-out="${esc(j.id)}">${expanded.has(j.id) ? "hide output" : "output"}</button>
       </span>
     </div>
     <div class="jmeta">${meta}</div>`;
  return card;
}

function outputPre(text) {
  const pre = document.createElement("pre");
  pre.className = "log";
  pre.textContent = text && text.length ? text : "(no output yet)";
  return pre;
}

async function outputFor(id) {
  try {
    const o = await (await fetch(`/api/bg/${encodeURIComponent(id)}/output?chars=8000`)).json();
    if (o.truncated) {
      const note = document.createElement("div");
      note.className = "warn-line";
      note.textContent = "showing the last 8000 chars \u2014 earlier output was dropped";
      return [outputPre(o.text), note];
    }
    return [outputPre(o.text)];
  } catch { return [outputPre("(output unavailable)")]; }
}

async function render() {
  try {
    const d = await (await fetch("/api/bg/jobs")).json();
    failures = 0;
    dot.classList.add("up");
    const running = d.jobs.filter(j => j.state === "Running");
    const done = d.jobs.filter(j => j.state !== "Running");
    count.textContent = d.jobs.length ? `${running.length} running / ${d.jobs.length} total` : "none";
    list.innerHTML = "";
    if (!d.jobs.length) {
      list.innerHTML = `<div class="empty">No background jobs. Long-running commands started with
background_start appear here \u2014 stop them with the stop button.</div>`;
      return;
    }
    for (const j of [...running, ...done]) {
      list.append(jobCard(j));
      if (expanded.has(j.id))
        for (const el of await outputFor(j.id)) list.append(el);
    }
  } catch (e) {
    dot.classList.remove("up");
    if (++failures === 3)
      // Surface unreachable (plugin reload / host restart): reload this page
      // and retry; the same port comes back up with the new generation.
      setTimeout(() => location.reload(), 2000);
  }
}

list.addEventListener("click", async (e) => {
  const stop = e.target.closest("[data-stop]");
  const out = e.target.closest("[data-out]");
  if (stop) {
    stop.disabled = true;
    try { await fetch(`/api/bg/${encodeURIComponent(stop.dataset.stop)}/kill`, { method: "POST" }); } catch {}
    render();
  } else if (out) {
    const id = out.dataset.out;
    expanded.has(id) ? expanded.delete(id) : expanded.add(id);
    render();
  }
});

render();
setInterval(render, 2000);
</script>
</body>
</html>
