<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>netPI · Work</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --row: #1d2129; --row-hi: #232833;
    --border: #2a2f3a; --text: #d7dbe2; --muted: #8b93a1;
    --green: #4ec9a0; --amber: #e0b15e; --blue: #679efe; --purple: #b180d8;
    --red: #e0708a;
    --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
    --sans: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 13px; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--panel);
    display: flex; align-items: center; gap: 8px; flex: 0 0 auto;
  }
  header .title { font-weight: 600; letter-spacing: .2px; }
  header .badge { color: var(--muted); font-size: 11px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.on { background: var(--green); }
  /* The panel itself never scrolls: each section is an independent scroll
     region (content-sized, shrinks + scrolls when it outgrows its share). */
  main { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; }
  section { border-bottom: 1px solid var(--border); flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  h2 {
    margin: 0; padding: 6px 12px; font-size: 11px; text-transform: uppercase;
    letter-spacing: .8px; color: var(--muted); background: var(--panel);
    display: flex; align-items: center; gap: 8px;
    position: sticky; top: 0; z-index: 1; /* stays put while its section scrolls */
  }
  h2 button.toggle { all: unset; cursor: pointer; color: var(--muted); font-size: 10px; padding: 0 4px; }
  .row {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    border-bottom: 1px solid #191c22; cursor: default;
  }
  .row:last-child { border-bottom: none; }
  .row.sel { background: var(--row-hi); }
  .row:hover { background: var(--row); }
  .row.nav { cursor: pointer; }
  .row.nav:focus-visible { outline: 1px solid var(--blue); outline-offset: -1px; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .t1 { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t1 .mono, .mono { font-family: var(--mono); font-size: 11.5px; }
  .meta { color: var(--muted); font-size: 11px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid var(--border); color: var(--muted); white-space: nowrap; flex: none; }
  .pill.running { color: var(--green); border-color: var(--green); }
  .pill.queued, .pill.waiting, .pill.cancelling { color: var(--amber); border-color: var(--amber); }
  .pill.suspended { color: var(--purple); border-color: var(--purple); }
  .pill.failed, .pill.killed { color: var(--red); border-color: var(--red); }
  .pill.cancelled { color: var(--muted); border-color: var(--muted); }
  .pill.completed, .pill.succeeded, .pill.runningjob { color: var(--green); border-color: var(--green); }
  button.ctl {
    font-family: var(--sans); font-size: 11px; padding: 2px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--row); color: var(--text); cursor: pointer; flex: none;
  }
  button.ctl:hover { background: var(--row-hi); }
  button.ctl:disabled { opacity: .4; cursor: not-allowed; }
  button.ctl.danger { color: var(--red); border-color: var(--red); }
  .empty { padding: 10px 12px; color: var(--muted); font-size: 12px; font-style: italic; }
  .err { color: var(--red); }
  .outbox {
    margin: 4px 12px 8px; padding: 8px; background: #0b0d10; border: 1px solid var(--border);
    border-radius: 6px; font-family: var(--mono); font-size: 11.5px;
    white-space: pre-wrap; word-break: break-word; color: #b8c0cc; max-height: 240px; overflow-y: auto;
    display: block;
  }
  .trunc-note { color: var(--amber); font-size: 11px; font-family: var(--sans); margin: 4px 0 0; }
  .lane-row { display: flex; align-items: center; gap: 8px; padding: 4px 12px; font-size: 12px; }
  .lane-row .pool { font-family: var(--mono); }
  .meta2 { color: var(--muted); font-size: 11px; }
  .lane-blocked { color: var(--red); font-size: 11px; }
  .subhead { padding: 4px 12px; font-size: 10px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); background: #12151b; }
  .elapsed { color: var(--muted); font-size: 11px; font-family: var(--mono); flex: none; }
  .state-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--muted); }
  .state-dot.running, .state-dot.succeeded, .state-dot.completed, .state-dot.runningjob { background: var(--green); }
  .state-dot.queued, .state-dot.waiting, .state-dot.cancelling { background: var(--amber); }
  .state-dot.suspended { background: var(--purple); }
  .state-dot.failed, .state-dot.killed { background: var(--red); }
  .state-dot.cancelled, .state-dot.recovery-required { background: var(--muted); }
  @media (max-width: 380px) {
    header { padding: 7px 9px; }
    section h2 { padding: 5px 9px; }
    .row { gap: 4px; padding: 5px 7px; }
    .meta { font-size: 10px; }
    button.ctl { padding: 2px 6px; }
    .lane-row { gap: 5px; padding: 4px 8px; flex-wrap: wrap; }
  }
</style>
</head>
<body>
  <header>
    <div class="dot" id="dot"></div>
    <span class="title">Work</span>
    <span class="badge" id="badge">connecting&hellip;</span>
    <span style="flex:1"></span>
    <span class="badge">event updates</span>
  </header>
  <main id="main">
    <section id="sec-lanes">
      <h2>LANES <span class="meta" id="lanes-n"></span></h2>
      <div id="lanes"></div>
    </section>
    <section id="sec-budget">
      <h2>BUDGET <span class="meta" id="budget-n"></span></h2>
      <div id="budget"></div>
    </section>
    <section id="sec-agents">
      <h2>AGENTS <span class="meta" id="agents-n"></span></h2>
      <div id="agents"></div>
      <div id="history-wrap" hidden>
        <div class="subhead">recent (terminal)</div>
        <div id="history"></div>
      </div>
    </section>
    <section id="sec-bg">
      <h2>BACKGROUND PROCESSES <span class="meta" id="bg-n"></span></h2>
      <div id="bgs"></div>
    </section>
    <section id="sec-fg">
      <h2>PROCESSES <span class="meta" id="fg-n"></span>
        <button class="toggle" id="fg-toggle" aria-expanded="true">[&minus;]</button>
      </h2>
      <div id="fgrun"></div>
      <div id="fgrecent"></div>
    </section>
  </main>
  <script>
    "use strict";
    const api = {
      work: () => fetch("/api/activity/work").then(r => r.json()),
      cancel: (id, subtree) => fetch(`/api/activity/agents/${encodeURIComponent(id)}/cancel`, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ subtree }),
      }).then(r => r.json()),
      stop: (id) => fetch(`/api/activity/processes/background/${encodeURIComponent(id)}/stop`, { method: "POST" }).then(r => r.json()),
      bgOutput: (id) => fetch(`/api/activity/processes/background/${encodeURIComponent(id)}/output?chars=8000`).then(r => r.json()),
    };

    // ---- bridge handshake (astra-2 §12.3) ------------------------------------
    // The shell (parent frame) posts { type:"netpi.panel.init", version:1 } to
    // this page after it mounts. We accept it ONLY from our immediate parent
    // frame and record its origin as the ONLY targetOrigin we ever post to
    // (never "*", never a hardcoded 5173). Until the handshake lands,
    // openSession is a no-op — nothing is guessed.
    let shellOrigin = null;
    window.addEventListener("message", (e) => {
      if (e.source !== window.parent) return;
      const d = e.data;
      if (!d || d.type !== "netpi.panel.init" || d.version !== 1) return;
      shellOrigin = e.origin;
    });

    function openSession(sessionId) {
      // Navigation ONLY: the shell selects the existing chat tab or opens the
      // session by id. This never spawns/resumes/cancels or touches lanes.
      if (!shellOrigin || !sessionId) return;
      try {
        window.parent.postMessage(
          { type: "netpi.panel.openSession", version: 1, payload: { sessionId } },
          shellOrigin);
      } catch (_) { /* parent gone — events refresh the view when it returns */ }
    }

    // ---- DOM helpers ----------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const fmtTime = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour12: false }); } catch { return ""; } };
    function fmtDur(ms) {
      if (!isFinite(ms) || ms < 0) ms = 0;
      const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
      if (h) return `${h}h ${m}m`;
      if (m) return `${m}m ${ss}s`;
      return `${ss}s`;
    }

    const fmtNum = (n) => { const v = Number(n); if (!isFinite(v)) return "0"; return v >= 1000 ? v.toLocaleString() : String(Math.round(v * 1000) / 1000); };
    const statusDot = (state, label = state) => `<span class="state-dot ${esc(state)}" title="${esc(label)}" aria-label="${esc(label)}"></span>`;

    /**
     * Reconcile a list container: rows are keyed by data-<key> and updated IN
     * PLACE (text/badges) so scroll, focus and selection survive refreshes. Rows
     * are reordered (re-appended) only when the id sequence changed; focused
     * elements are re-focused by (row, part) after a reorder.
     */
    function reconcile(container, key, items, render, update) {
      const existing = new Map();
      for (const el of Array.from(container.children))
        if (el.dataset && el.dataset[key]) existing.set(el.dataset[key], el);
      const active = document.activeElement;
      const activeKey = active && container.contains(active) && active.dataset ? active.dataset[key] : null;
      const activePart = active && active.dataset ? (active.dataset.part || null) : null;

      const oldOrder = Array.from(existing.keys());
      const newOrder = items.map(it => it[key]);
      const orderChanged = oldOrder.length !== newOrder.length ||
        oldOrder.some((id, i) => id !== newOrder[i]);

      for (const item of items) {
        let el = existing.get(item[key]);
        if (!el) {
          el = render(item, container);
          container.appendChild(el);
        } else {
          update(el, item);
          if (orderChanged) container.appendChild(el); // re-append = move
        }
      }
      for (const [id, el] of existing) if (!newOrder.includes(id)) el.remove();

      if (activeKey && activePart) {
        const el = existing.get(activeKey);
        const tgt = el && el.querySelector(`[data-part="${activePart}"]`);
        if (tgt && tgt !== active) { try { tgt.focus({ preventScroll: true }); } catch (_) {} }
      }
    }

    // ---- section renderers ----------------------------------------------------

    const selRow = { agent: null, bg: null };
    const expandedBg = new Set(); // job ids whose output pane is open

    function laneDisplay(r) {
      if (r.executionMode === "cloud-direct") return "Cloud · direct";
      if (r.lifecycle === "queued" || r.lifecycle === "waiting")
        return r.poolId ? `waiting for ${r.poolId}` : "waiting for pool";
      if (r.laneId) return `${r.poolId || "pool"} / ${r.laneId}`;
      return r.poolId || "—";
    }

    function agentBadges(r) {
      return statusDot(r.lifecycle) +
        `<span class="meta">${esc(r.phase || "")}</span>`;
    }

    function agentRowInner(r) {
      const lane = laneDisplay(r);
      const created = r.createdAt ? fmtTime(r.createdAt) : "";
      const started = r.startedAt ? ` started ${fmtTime(r.startedAt)}` : "";
      const dur = r.startedAt ? ` · ${fmtDur((r.endedAt ? new Date(r.endedAt) : Date.now()) - new Date(r.startedAt))}` : "";
      const parent = r.parentAgentId ? ` ← ${r.parentAgentId.slice(0, 8)}` : "";
      const team = r.teamId ? ` team ${r.teamId.slice(0, 6)}` : "";
      return `
        <div class="grow">
          <div class="t1">${esc(r.title || "—")} <span class="meta">${esc(r.sessionId || "")}${team}${parent}</span></div>
          <div class="meta">${esc(lane)}${r.modelId ? " · " + esc(r.modelId) : ""} · ${created}${started}${dur}${r.reason ? " · " + esc(r.reason) : ""}</div>
        </div>
        ${agentBadges(r)}
        ${r.nonTerminal ? `<button class="ctl danger" data-part="cancel" data-id="${esc(r.assignmentId)}" title="Cancel this assignment and its descendants (subtree)">cancel</button>` : ""}
      `;
    }

    function agentRow(r) {
      const el = document.createElement("div");
      el.className = "row nav";
      el.dataset.a = r.assignmentId;
      el.tabIndex = 0;
      el.setAttribute("role", "link");
      el.innerHTML = agentRowInner(r);
      el.addEventListener("click", (e) => {
        if (e.target.closest("button")) return; // controls never navigate
        selRow.agent = r.assignmentId;
        if (r.sessionId) openSession(r.sessionId);
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selRow.agent = r.assignmentId;
          if (r.sessionId) openSession(r.sessionId);
        }
      });
      return el;
    }

    function updateAgentRow(el, r) {
      el.dataset.a = r.assignmentId;
      el.title = r.sessionId ? `Open session ${r.sessionId}` : "no session";
      const inner = agentRowInner(r);
      if (el.innerHTML !== inner) el.innerHTML = inner;
    }

    function historyRow(r) {
      const el = document.createElement("div");
      el.className = "row";
      el.dataset.h = r.assignmentId;
      el.innerHTML = `
        <div class="grow">
          <div class="t1">${esc(r.title || "—")} <span class="meta">${esc(r.sessionId || "")}</span></div>
          <div class="meta">${r.endedAt ? fmtTime(r.endedAt) : ""}${r.reason ? " · " + esc(r.reason) : ""}</div>
        </div>
        ${statusDot(r.lifecycle)}`;
      return el;
    }

    function bgRowInner(j) {
      const end = j.exitedAt ? new Date(j.exitedAt) : Date.now();
      const dur = fmtDur(end - new Date(j.startedAt));
      const stateCls = j.state === "Running" ? "runningjob" : j.state === "Failed" ? "failed" : j.state === "Killed" ? "killed" : "completed";
      return `
        <div class="grow">
          <div class="t1 mono" title="${esc(j.command)}">${esc(j.command)}</div>
          <div class="meta">${j.shell ? esc(j.shell) + " · " : ""}${fmtTime(j.startedAt)} · ${dur}${j.exitCode != null ? " · exit " + j.exitCode : ""}${j.sessionId ? " · " + esc(j.sessionId) : ""}</div>
        </div>
        ${statusDot(stateCls, j.state)}
        <button class="ctl" data-part="out" data-id="${esc(j.id)}">${expandedBg.has(j.id) ? "hide output" : "output"}</button>
        ${j.state === "Running" ? `<button class="ctl danger" data-part="stop" data-id="${esc(j.id)}">stop</button>` : ""}
      `;
    }

    function bgRow(j) {
      const el = document.createElement("div");
      el.className = "row";
      el.dataset.b = j.id;
      el.innerHTML = bgRowInner(j);
      el.addEventListener("click", (e) => {
        if (e.target.closest("button")) return;
        selRow.bg = j.id;
      });
      return el;
    }

    function updateBgRow(el, j) {
      el.dataset.b = j.id;
      const output = el.querySelector(".outbox");
      const note = el.querySelector(".trunc-note");
      el.innerHTML = bgRowInner(j);
      if (output) {
        el.appendChild(output);
        if (note) el.appendChild(note);
        refreshOutput(j.id, output);
      }
    }

    /**
     * Output panes are rendered as a child `.outbox[data-for]` of the row, so
     * they move with the row and are never orphaned by a reconcile.
     */
    function renderBgOutput(el, id) {
      el.querySelectorAll(".outbox, .trunc-note").forEach(x => x.remove());
      if (!expandedBg.has(id)) return;
      const box = document.createElement("pre");
      box.className = "outbox";
      box.dataset.for = id;
      box.textContent = "loading…";
      el.appendChild(box);
      refreshOutput(id, box);
    }

    async function refreshOutput(id, box) {
      if (!box) {
        const row = document.querySelector(`[data-b="${CSS.escape(id)}"]`);
        box = row && row.querySelector(`.outbox[data-for="${CSS.escape(id)}"]`);
        if (!box || !expandedBg.has(id)) return;
      }
      try {
        const o = await api.bgOutput(id);
        if (!expandedBg.has(id)) {
          const row = box.closest("[data-b]");
          if (row && !row.querySelector(`[data-part="out"][data-id="${CSS.escape(id)}"]`)) return;
        }
        box.textContent = o.text && o.text.length ? o.text : "(no output)";
        box.scrollTop = box.scrollHeight; // keep the tail pinned
        let note = box.nextElementSibling;
        if (o.truncated) {
          if (!note || !note.classList || !note.classList.contains("trunc-note")) {
            note = document.createElement("div");
            note.className = "trunc-note";
            note.textContent = "showing the last 8000 chars — earlier output was dropped";
            box.after(note);
          }
        } else if (note && note.classList && note.classList.contains("trunc-note")) note.remove();
      } catch (_) { if (box) box.textContent = "(output unavailable)"; }
    }

    function fgInner(p, recent) {
      const state = recent ? (p.exitCode == null ? "killed" : "completed") : "running";
      const stateCls = state === "running" ? "runningjob" : state === "killed" ? "killed" : "completed";
      return `
        <div class="grow">
          <div class="t1 mono" title="${esc(p.command)}">${esc(p.toolShellId || "")}: ${esc(p.command)}</div>
          <div class="meta">${p.processId ? "pid " + p.processId : ""}${p.workingDirectory ? " · " + esc(p.workingDirectory) : ""}${p.sessionId ? " · " + esc(p.sessionId) : ""} · ${fmtTime(p.startedAt)}</div>
        </div>
        ${statusDot(stateCls, state)}
        <span class="elapsed">${fmtDur((p.exitedAt ? new Date(p.exitedAt) : Date.now()) - new Date(p.startedAt))}</span>`;
    }

    function fgRow(p, recent) {
      const el = document.createElement("div");
      el.className = "row";
      el.dataset.f = String(p.processId);
      el.innerHTML = fgInner(p, recent);
      return el;
    }

    // ---- availability / section state ------------------------------------------

    function sectionUnavailable(box, msg) {
      box.innerHTML = "";
      const d = document.createElement("div");
      d.className = "empty err";
      d.textContent = msg;
      box.appendChild(d);
    }

    function renderLanes(d) {
      const box = $("lanes");
      if (!d || !d.available) {
        sectionUnavailable(box, "lane scheduler unavailable — agents & processes still work.");
        $("lanes-n").textContent = "";
        return;
      }
      const pools = d.pools || [];
      if (!pools.length) {
        box.innerHTML = `<div class="empty">no pools configured.</div>`;
        $("lanes-n").textContent = "";
        return;
      }
      box.innerHTML = pools.map(p => {
        // Render the REPORTED N — never a hardcoded lane count.
        const cap = p.effectiveCapacity != null ? `${p.ownedCount}/${p.effectiveCapacity}` : `${p.ownedCount}/?`;
        const mode = p.capacityMode === "provider" ? "follows provider" : p.capacityMode === "manual" ? "manual" : "";
        const provider = p.providerReportedConcurrency != null ? ` provider ${p.providerReportedConcurrency}` : "";
        const status = p.providerStatus === "stale" ? " · provider observation stale" : "";
        const capNote = p.userCap != null ? ` (cap ${p.userCap})` : "";
        return `<div class="lane-row">
          <span class="pool">${esc(p.poolId)}</span>
          <span class="pill ${p.canAdmit ? "running" : ""}">${esc(cap)}</span>
          <span class="meta2">${esc(mode)}${provider}${capNote}${status}</span>
          <span class="meta2">queue ${p.queueCount}</span>
          ${p.draining ? `<span class="pill cancelling">draining</span>` : ""}
          ${p.blockedReason ? `<span class="lane-blocked">${esc(p.blockedReason)}</span>` : ""}
        </div>`;
      }).join("");
      const totalOwned = pools.reduce((a, p) => a + p.ownedCount, 0);
      const totalQueue = pools.reduce((a, p) => a + p.queueCount, 0);
      $("lanes-n").textContent = `(${pools.length} pool${pools.length === 1 ? "" : "s"} · ${totalOwned} owned · ${totalQueue} queued)`;
    }

    function renderBudgets(b) {
      const box = $("budget");
      if (!b || !b.available) {
        sectionUnavailable(box, "cloud budget service unavailable.");
        $("budget-n").textContent = "";
        return;
      }
      const teams = b.teams || [];
      if (!teams.length) {
        box.innerHTML = `<div class="empty">no cloud budgets configured.</div>`;
        $("budget-n").textContent = "";
        return;
      }
      box.innerHTML = teams.map(t => {
        const label = `${esc(t.teamId)} · ${esc(t.unit)}` + (t.currency ? ` (${esc(t.currency)})` : "");
        const spent = `${fmtNum(t.spent)} / ${fmtNum(t.limit)}${t.unit === "tokens" ? " tok" : ""}`;
        const pct = t.limit > 0 ? Math.min(100, Math.round((t.spent / t.limit) * 100)) : 0;
        return `<div class="lane-row">
          <span class="pool">${label}</span>
          <span class="pill ${pct >= 100 ? "" : "running"}">${spent}</span>
          <span class="meta2">remaining ${fmtNum(t.remaining)} · reserved ${fmtNum(t.reserved)}</span>
        </div>`;
      }).join("");
      $("budget-n").textContent = `(${teams.length} team${teams.length === 1 ? "" : "s"})`;
    }

    function renderAgents(a) {
      const box = $("agents");
      const wrap = $("history-wrap");
      // The live list is served by EITHER source: the orchestrator (assignment
      // rows) or the runner (direct session runs merged in server-side). Only
      // when BOTH are absent is the section unavailable.
      if (a && (a.agentsAvailable || a.runsAvailable)) {
        const rows = (a.agents || []);
        reconcile(box, "a", rows, agentRow, updateAgentRow);
        const emptyEl = box.querySelector(":scope > .empty");
        if (!rows.length && !emptyEl) {
          const d = document.createElement("div");
          d.className = "empty";
          d.textContent = "no active agents.";
          box.appendChild(d);
        } else if (rows.length && emptyEl) {
          emptyEl.remove(); // a row arrived — the placeholder must not linger
        }
        const hist = (a.history || []);
        wrap.hidden = hist.length === 0;
        if (hist.length)
          reconcile($("history"), "h", hist, historyRow, () => {}); // terminal rows are immutable
        $("agents-n").textContent = `(${rows.length} active${hist.length ? ` · ${hist.length} recent` : ""})`;
      } else if (a && !a.agentsAvailable && !a.runsAvailable) {
        sectionUnavailable(box, "agent services unavailable — processes still work.");
        $("agents-n").textContent = "";
        wrap.hidden = true;
      }
    }

    function renderBg(p) {
      const box = $("bgs");
      if (p && p.background && p.background.available) {
        const jobs = p.background.jobs || [];
        reconcile(box, "b", jobs, bgRow, updateBgRow);
        $("bg-n").textContent = `(${jobs.length})`;
      } else if (p && p.background && !p.background.available) {
        sectionUnavailable(box, "background tasks not loaded.");
        $("bg-n").textContent = "";
      }
    }

    let fgOpen = true;
    function renderFg(p) {
      const runBox = $("fgrun"), recBox = $("fgrecent");
      if (fgOpen) runBox.style.display = recBox.style.display = "";
      if (p && p.foreground && p.foreground.available) {
        const run = p.foreground.running || [];
        const rec = (p.foreground.recent || []).slice(0, 12);
        reconcile(runBox, "f", run, (x) => fgRow(x, false), (el, r) => { if (el.innerHTML !== fgInner(r, false)) el.innerHTML = fgInner(r, false); });
        reconcile(recBox, "f", rec, (x) => fgRow(x, true), (el, r) => { if (el.innerHTML !== fgInner(r, true)) el.innerHTML = fgInner(r, true); });
        $("fg-n").textContent = `(${run.length} running · ${rec.length} recent)`;
      } else if (p && p.foreground && !p.foreground.available) {
        if (fgOpen) { sectionUnavailable(runBox, "foreground tools not loaded."); recBox.innerHTML = ""; }
        $("fg-n").textContent = "";
      }
    }

    // ---- button actions (event delegation) --------------------------------------
    document.addEventListener("click", (e) => {
      const b = e.target.closest("button.ctl");
      if (!b) return;
      e.stopPropagation(); // controls never trigger row navigation
      const id = b.dataset.id;
      const part = b.dataset.part;
      if (part === "cancel") {
        b.disabled = true;
        api.cancel(id, true).then(scheduleRefresh).catch(() => {});
      } else if (part === "stop") {
        b.disabled = true;
        api.stop(id).then(scheduleRefresh).catch(() => {});
      } else if (part === "out") {
        if (expandedBg.has(id)) expandedBg.delete(id); else expandedBg.add(id);
        const row = b.closest("[data-b]");
        if (row) renderBgOutput(row, id);
        scheduleRefresh();
      }
    });

    $("fg-toggle").addEventListener("click", () => {
      fgOpen = !fgOpen;
      $("fg-toggle").setAttribute("aria-expanded", String(fgOpen));
      $("fg-toggle").textContent = fgOpen ? "[−]" : "[+]";
      $("fgrun").style.display = $("fgrecent").style.display = fgOpen ? "" : "none";
    });

    // ---- event driven snapshots -------------------------------------------------
    let inFlight = false, refreshPending = false, refreshTimer = null;
    async function refresh() {
      if (document.visibilityState !== "visible") return;
      if (inFlight) { refreshPending = true; return; }
      inFlight = true;
      try {
        const d = await api.work();
        $("dot").classList.add("on");
        $("badge").textContent = "live";
        renderLanes(d.lanes);
        renderBudgets(d.budgets);
        renderAgents(d.agents);
        renderBg(d.processes);
        renderFg(d.processes);
      } catch (_) {
        $("dot").classList.remove("on");
        $("badge").textContent = "reconnecting…";
      } finally {
        inFlight = false;
        if (refreshPending) {
          refreshPending = false;
          scheduleRefresh();
        }
      }
    }
    function scheduleRefresh() {
      if (refreshTimer !== null) return;
      refreshTimer = setTimeout(() => { refreshTimer = null; refresh(); }, 60);
    }
    const events = new EventSource("/api/activity/events");
    events.addEventListener("refresh", scheduleRefresh);
    events.onopen = () => { $("badge").textContent = "connected"; scheduleRefresh(); };
    events.onerror = () => { $("dot").classList.remove("on"); $("badge").textContent = "reconnecting…"; };
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") scheduleRefresh();
    });
    refresh();
  </script>
</body>
</html>
