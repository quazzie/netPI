name: CI

# Build and run the five unit suites (Providers, Tools, Agent, Aux, Host) on every push and pull request.
#
# The suites run on windows-latest on purpose:
#   - the Aux suite drives a real browser (the screenshot test renders a page in a headless Edge/Chrome, and the
#     browser tests attach to one through its DevTools port). The Windows runner has Edge; a runner without a
#     browser skips those checks (it prints "attach skipped" and takes no screenshots), but the full behaviour is
#     only exercised on a machine with a browser, so that is where the suite runs.
#   - the shell tests run pwsh and bash, and the desktop shell (net10.0-windows, WebView2) is Windows-only.
#
# The repo also builds on Linux/macOS (./build.sh builds everything except the Windows desktop shell), but the
# unit suites are not run there yet: add a Linux job once the suites are green there, keeping the Aux browser
# tests in mind (they need a browser, or they skip).
#
# No publishing, no secrets, no deployment: scripts/test.ps1 builds the five test projects (Release) into
# artifacts/dev/app and runs each suite, exiting non-zero when any test fails. The e2e job runs the real-server suite
# (scripts/e2e.ps1) the same way.
on:
  push:
  pull_request:

jobs:
  test:
    name: build + unit suites (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        # every project targets net10.0 (Directory.Build.props); there is no global.json pin
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore the five test projects
        # the test projects pull in the plugins they exercise; the desktop shell is not in their graph
        run: |
          foreach ($suite in 'Providers', 'Tools', 'Agent', 'Aux', 'Host') {
            dotnet restore "tests/NetPI.$suite.Tests/NetPI.$suite.Tests.csproj"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build and run the suites
        # builds each suite (Release) and runs its runner; the full output is kept in artifacts/testlogs
        run: pwsh -File ./scripts/test.ps1

  ui:
    name: web UI end-to-end (mock server)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The mock e2e (npm run e2e) drives the real UI against web/mock/server.mjs: 250+ checks over the composer,
      # the chat, the plugin tabs and the dev-server proxy. It was not run anywhere, which is how it rotted — it had
      # been dying at check ~105 of 253 for a while (a selector that predated the status grouping, and a variable
      # left out of scope) and nobody noticed, because "it passes locally" was someone's memory.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and build the UI
        run: |
          npm ci
          npm run build

      # The bundles are committed and `dotnet build` ships them, so a fresh build that differs from what is committed
      # is either a UI change without its bundle or a bundle that was committed by hand. 95 commits touched a bundle and
      # 10 of them changed no source at all, which is what this catches (web/svelte.config.js and build-plugins.mjs
      # set Svelte's rootDir, so the CSS class hashes no longer depend on where the build ran).
      - name: The committed bundles are what a fresh build produces
        run: |
          git diff --exit-code -- web/dist "plugins/*/wwwroot"
          $new = git status --porcelain -- web/dist "plugins/*/wwwroot"
          if ($new) { Write-Error "fresh bundle files that are not committed:`n$new" }

      - name: Run the mock e2e
        run: npm run e2e

  e2e:
    name: end-to-end (real server, mock model)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      # the inspect test runs scripts/netpi.mjs, which needs node (the browser tests are covered by the ui job and run locally)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # scripts/e2e.ps1 builds the solution into artifacts/dev/app (nothing is published or installed), then runs the backend
      # tests sharded, each shard with its own server and mock model server on free ports. Every failure of the run is listed at
      # once; its evidence (server log, the mock's requests, client events) is under artifacts/e2elogs and uploaded below.
      - name: Build and run the end-to-end suite (without the browser tests)
        run: pwsh -File ./scripts/e2e.ps1 -NoUi

      - name: Run the runner's own tests
        run: pwsh -File ./scripts/e2e.ps1 -SelfTest -SkipBuild

      - name: Keep the evidence of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: artifacts/e2elogs
          retention-days: 7
